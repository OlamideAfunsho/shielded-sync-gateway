[workspace]
resolver = "2"
members = ["crates/lwproto", "crates/verifier", "crates/producer", "crates/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
prost = "0.13"
tonic = "0.12"
tonic-build = "0.12"
blake2b_simd = "1"
sha2 = "0.10"
thiserror = "2"
zcash_primitives = { version = "=0.30.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-stream = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http2"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
anyhow = "1"
pin-project-lite = "0.2"
