# zainod 0.10.1 in fetch mode: it reads blocks from zebrad's JSON-RPC
# and serves CompactTxStreamer on 8137. Rendered by scripts/regtest.sh.
backend = "fetch"
network = "Regtest"

[grpc_settings]
listen_address = "127.0.0.1:8137"

[validator_settings]
validator_jsonrpc_listen_address = "127.0.0.1:18232"
validator_user = "xxxxxx"
validator_password = "xxxxxx"

[storage]
database.path = ".run/zaino"
